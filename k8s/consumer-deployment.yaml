apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-consumer
  labels:
    app: telemetry-consumer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telemetry-consumer
  template:
    metadata:
      labels:
        app: telemetry-consumer
    spec:
      serviceAccountName: workload-identity-sa
      containers:
      - name: consumer
        image: telemetry-consumer:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: dsn
